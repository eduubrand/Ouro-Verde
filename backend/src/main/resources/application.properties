spring.application.name=backend

# Porta: o Render (e outros servicos) informam a porta pela variavel PORT.
# No seu computador, sem PORT definida, continua 8080.
server.port=${PORT:8080}

# ----------------------------------------------------------
# Banco de dados
# Cada integrante pode ter uma senha diferente no Postgres.
# Em vez de editar este arquivo (e gerar conflito no git),
# defina as variaveis de ambiente DB_URL, DB_USER e DB_PASSWORD.
# Se nao definir, usa os valores padrao depois dos ":".
# ----------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ouro_verde}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# "update" cria/ajusta colunas que faltarem, sem apagar dados.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.jpa.show-sql=false
