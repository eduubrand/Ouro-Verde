<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ouro Verde</title>

    <link rel="icon" type="image/png" href="../adminAssets/logo.png">
    <link rel="stylesheet" href="../adminCSS/dashboard.css">
    <link rel="stylesheet" href="../adminCSS/extras.css">

    <!-- Bloqueia a pagina antes de desenhar, se nao houver admin logado -->
    <script src="../config.js"></script>
    <script src="../adminJS/api.js"></script>
    <script>exigirLogin();</script>
</head>
<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="logo-placeholder">
                <img src="../adminAssets/logo.png" alt="Ouro Verde">
            </div>
            <nav>
                <a href="dashboard.html" class="active">DASHBOARD</a>
                <a href="pedidos.html">PEDIDOS</a>
                <a href="produtos.html">PRODUTOS</a>
            </nav>
        </div>
        <div class="sidebar-bottom">
            <a href="#" id="logoutBtn">SAIR</a>
        </div>
    </aside>

    <!-- CONTEÚDO -->
    <main class="content">

        <h1>PAINEL<span>ADMIN</span></h1>

        <section class="cards">
            <div class="card">
                <h3>RECEITA DO MÊS</h3>
                <p id="receitaMensal">-</p>
            </div>
            <div class="card">
                <h3>PRODUTOS CADASTRADOS</h3>
                <p id="produtosAtivos">-</p>
            </div>
            <div class="card">
                <h3>PEDIDOS PENDENTES</h3>
                <p id="pedidosPendentes">-</p>
            </div>
        </section>

        <div class="action-buttons">
            <button onclick="window.location.href='pedidos.html'">TODOS OS PEDIDOS</button>
            <button onclick="window.location.href='produtos.html'">GERENCIAR PRODUTOS</button>
        </div>

        <section class="table-container">
            <h3>PEDIDOS RECENTES:</h3>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>CLIENTE</th>
                        <th>DATA DO EVENTO</th>
                        <th>ENTREGA</th>
                        <th>TOTAL</th>
                        <th>STATUS</th>
                        <th>AÇÃO</th>
                    </tr>
                </thead>
                <tbody id="pedidosTable"></tbody>
            </table>
        </section>

    </main>

</div>

<!-- MODAL DE SAIR -->
<div class="modal" id="logoutModal">
    <div class="modal-content">
        <h2>Tem certeza que quer sair?</h2>
        <div class="modal-buttons">
            <button id="confirmLogout">SAIR</button>
            <button id="cancelLogout">CANCELAR</button>
        </div>
    </div>
</div>

<script src="../adminJS/dashboard.js"></script>

</body>
</html>
