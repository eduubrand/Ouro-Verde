<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos · Painel Ouro Verde</title>
    <meta name="theme-color" content="#16291d">
    <meta name="robots" content="noindex">

    <link rel="icon" type="image/png" href="../adminAssets/logo.png">
    <link rel="stylesheet" href="../Css/base.css">
    <link rel="stylesheet" href="../adminCSS/admin.css">

    <script src="../config.js"></script>
    <script src="../adminJS/api.js"></script>
    <script>exigirLogin();</script>
</head>
<body>

<div class="admin">

    <aside class="sidebar">
        <a href="dashboard.html" class="sidebar-marca">
            <img src="../Imagens/WhatsApp Image 2026-05-07 at 10.17.49 (1) 2.png" alt="">
            <span>Ouro Verde<small>Painel</small></span>
        </a>
        <nav class="sidebar-nav">
            <a href="dashboard.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></svg>
                Visão geral
            </a>
            <a href="pedidos.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h7M8.5 18h4"/></svg>
                Pedidos
            </a>
            <a href="produtos.html" class="active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/></svg>
                Produtos
            </a>
        </nav>
        <a href="#" id="logoutBtn" class="sidebar-sair">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h4.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14M10 16l-4-4 4-4M6 12h10"/></svg>
            Sair
        </a>
    </aside>

    <main class="content">

        <header class="content-topo">
            <div>
                <span class="eyebrow">Painel administrativo</span>
                <h1>Produtos e categorias</h1>
            </div>
        </header>

        <section class="cards">
            <div class="card">
                <h3>Produtos cadastrados</h3>
                <p id="totalProdutos">-</p>
            </div>
            <div class="card">
                <h3>Sem estoque</h3>
                <p id="semEstoque">-</p>
            </div>
            <div class="card">
                <h3>Categorias</h3>
                <p id="totalCategorias">-</p>
            </div>
        </section>

        <!-- FORMULÁRIO DE PRODUTO (UC08) -->
        <section class="form-container">

            <div class="painel-topo">
                <h2 id="tituloForm">Novo produto</h2>
            </div>

            <form id="produtoForm">
                <input type="hidden" id="idEdicao">

                <div class="form-grid">
                    <div class="campo">
                        <label for="nome">Nome do produto *</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="campo">
                        <label for="categoria">Categoria *</label>
                        <select id="categoria" required>
                            <option value="">Carregando categorias...</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="preco">Preço por unidade (R$) *</label>
                        <input type="number" id="preco" min="0" step="0.01" inputmode="decimal" required>
                    </div>

                    <div class="campo">
                        <label for="estoque">Estoque total (unidades) *</label>
                        <input type="number" id="estoque" min="0" step="1" inputmode="numeric" required>
                    </div>

                    <div class="campo inteiro">
                        <label for="imagem">Imagem (link)</label>
                        <input type="url" id="imagem" placeholder="https://...">
                    </div>
                </div>

                <div class="form-botoes">
                    <button type="submit" class="btn btn-primario" id="btnSalvar">Adicionar produto</button>
                    <button type="button" class="btn btn-contorno" id="btnCancelar" style="display:none;">Cancelar edição</button>
                </div>
            </form>

        </section>

        <!-- TABELA DE PRODUTOS -->
        <section class="table-container">
            <div class="painel-topo">
                <h2>Produtos cadastrados</h2>
            </div>
            <table class="tabela responsiva">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Imagem</th>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="produtosTable"></tbody>
            </table>
        </section>

        <!-- CATEGORIAS (UC07) -->
        <section class="form-container">
            <div class="painel-topo">
                <h2>Categorias</h2>
            </div>
            <form id="categoriaForm" class="form-inline">
                <div class="campo">
                    <label for="nomeCategoria">Nova categoria</label>
                    <input type="text" id="nomeCategoria" placeholder="Ex.: Louças" required>
                </div>
                <button type="submit" class="btn btn-primario">Adicionar</button>
            </form>
            <div id="listaCategorias" class="categorias-lista"></div>
        </section>

    </main>

</div>

<!-- MODAL DE SAIR -->
<div class="modal" id="logoutModal">
    <div class="modal-content">
        <h2>Sair do painel?</h2>
        <div class="modal-buttons">
            <button id="cancelLogout" class="btn btn-contorno">Cancelar</button>
            <button id="confirmLogout" class="btn">Sair</button>
        </div>
    </div>
</div>

<script src="../adminJS/produtos.js"></script>

</body>
</html>
