<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · Painel Ouro Verde</title>
    <meta name="theme-color" content="#16291d">
    <meta name="robots" content="noindex">

    <link rel="icon" type="image/png" href="../adminAssets/logo.png">
    <link rel="stylesheet" href="../Css/base.css">
    <link rel="stylesheet" href="../adminCSS/admin.css">
</head>
<body>

<div class="login-admin">

    <section class="login-arte">
        <img src="../adminAssets/logo.png" alt="Ouro Verde Buffet">
        <p>Pedidos, pagamentos e estoque do Ouro Verde em um só lugar.</p>
    </section>

    <section class="login-form">

        <span class="eyebrow">Painel administrativo</span>
        <h1>Entrar</h1>
        <p>Acesso restrito à equipe Ouro Verde.</p>

        <div id="errorMessage" class="error-message">E-mail ou senha incorretos.</div>

        <form id="loginForm" class="form-pilha">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="username" required>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primario btn-bloco">Entrar</button>
        </form>

        <p class="login-rodape"><a href="../index.html">← Ir para o site</a></p>

    </section>

</div>

<script src="../config.js"></script>
<script src="../adminJS/api.js"></script>
<script src="../adminJS/login.js"></script>

</body>
</html>
