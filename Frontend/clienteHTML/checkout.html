<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar pedido · Ouro Verde</title>
    <meta name="theme-color" content="#16291d">
    <link rel="icon" type="image/png" href="../adminAssets/logo.png">
    <link rel="stylesheet" href="../Css/base.css">
    <link rel="stylesheet" href="../Css/style.css">
</head>

<body>

    <header class="site-header">
        <div class="wrap">
            <a href="../index.html" class="marca">
                <img src="../Imagens/WhatsApp Image 2026-05-07 at 10.17.49 (1) 2.png" alt="Ouro Verde Buffet">
                <span>Ouro Verde<small>Buffet &amp; Locação</small></span>
            </a>
            <a href="../index.html#catalogo" class="voltar">← Voltar ao catálogo</a>
        </div>
    </header>

    <main class="pagina">
        <div class="wrap">

            <div class="pagina-titulo">
                <span class="eyebrow">Último passo</span>
                <h1>Finalizar pedido</h1>
            </div>

            <form id="form-checkout" class="checkout">

                <section class="painel">

                    <div class="painel-secao">
                        <h2>Seus dados</h2>
                        <div class="form-grade">
                            <div class="campo">
                                <label for="nome">Nome</label>
                                <input type="text" id="nome" readonly>
                            </div>
                            <div class="campo">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" readonly>
                            </div>
                            <p class="dica inteiro">Não é você? <a href="#" id="trocar-conta">Entrar com outra conta</a></p>
                        </div>
                    </div>

                    <div class="painel-secao">
                        <h2>Evento</h2>
                        <div class="form-pilha">
                            <div class="campo">
                                <label for="servico">Espaço ou serviço</label>
                                <select id="servico" required>
                                    <option value="">Carregando...</option>
                                </select>
                                <small id="descricao-servico" class="dica"></small>
                            </div>

                            <div class="campo">
                                <label for="dataEvento">Data do evento *</label>
                                <input type="date" id="dataEvento" required>
                                <small id="aviso-disponibilidade" class="aviso"></small>
                            </div>
                        </div>
                    </div>

                    <div class="painel-secao">
                        <h2>Entrega ou retirada</h2>
                        <div class="opcoes">
                            <label class="opcao">
                                <input type="radio" name="tipoEntrega" value="RETIRADA" checked>
                                <span>
                                    <strong>Retirar no Ouro Verde</strong>
                                    <small>Você busca os itens com a gente.</small>
                                </span>
                            </label>
                            <label class="opcao">
                                <input type="radio" name="tipoEntrega" value="ENTREGA">
                                <span>
                                    <strong>Entrega no endereço</strong>
                                    <small>Levamos até o endereço do seu cadastro.</small>
                                </span>
                            </label>
                        </div>
                        <p id="endereco-entrega" class="dica endereco-entrega oculto"></p>
                    </div>

                </section>

                <aside class="painel resumo">

                    <h2>Resumo</h2>

                    <div id="itensResumo"></div>

                    <div class="linha-resumo">
                        <span>Itens</span>
                        <span id="subtotal">R$ 0,00</span>
                    </div>

                    <div class="linha-resumo">
                        <span id="nome-servico-resumo">Serviço</span>
                        <span id="preco-servico">R$ 0,00</span>
                    </div>

                    <div class="linha-resumo total">
                        <span>Total</span>
                        <span id="total">R$ 0,00</span>
                    </div>

                    <div class="form-pilha">
                        <div class="campo">
                            <span class="rotulo">Forma de pagamento</span>
                            <div class="opcoes">
                                <label class="opcao">
                                    <input type="radio" name="metodoPagamento" value="PIX" checked>
                                    <span><strong>Pix</strong><small>Chave enviada após o pedido</small></span>
                                </label>
                                <label class="opcao">
                                    <input type="radio" name="metodoPagamento" value="PRESENCIAL">
                                    <span><strong>Pessoalmente</strong><small>Dinheiro ou cartão</small></span>
                                </label>
                            </div>
                        </div>

                        <div class="campo">
                            <label for="parcelas">Parcelas</label>
                            <select id="parcelas">
                                <option value="1">1x (à vista)</option>
                                <option value="2">2x</option>
                                <option value="3">3x</option>
                            </select>
                            <small id="valor-parcela" class="dica"></small>
                        </div>
                    </div>

                    <button type="submit" id="btn-finalizar" class="btn btn-primario btn-bloco">Finalizar pedido</button>

                </aside>

            </form>

        </div>
    </main>

    <script src="../config.js"></script>
    <script src="../clienteJS/api.js"></script>
    <script src="../clienteJS/checkout.js"></script>

</body>

</html>
